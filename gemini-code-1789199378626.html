<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重返亞特蘭提斯：人魚公主與數靈聖域</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0d1b2a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 500px;
            background: linear-gradient(180deg, #1cb5e0 0%, #000851 100%);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 畫面切換 */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: rgba(0, 8, 81, 0.8);
            backdrop-filter: blur(5px);
        }
        .screen.active {
            display: flex;
        }

        /* 首頁 */
        h1 {
            font-size: 32px;
            color: #ffb6c1;
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 18px;
            color: #afeeee;
            margin-bottom: 40px;
        }
        .btn {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            border: 3px solid #fff;
            border-radius: 30px;
            padding: 15px 40px;
            font-size: 24px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.6);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        /* 關卡選擇 */
        .level-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .level-btn {
            background: #1e90ff;
            border: 2px solid #87cefa;
            border-radius: 15px;
            padding: 20px;
            font-size: 24px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 191, 255, 0.5);
        }
        
        /* 遊戲主畫面 */
        #gameplay-screen {
            background: transparent;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 頂部資訊列 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            width: 100%;
        }
        .hp-bar { font-size: 24px; color: #ff4757; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .progress-bar { font-size: 20px; color: #f1c40f; }

        /* 題目區 */
        .question-area {
            text-align: center;
            font-size: 50px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px #00ffff;
            margin-top: -20px;
        }
        .timer-bar-container {
            width: 300px;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            margin: 10px auto;
            overflow: hidden;
        }
        .timer-bar {
            height: 100%;
            background: #00ffcc;
            width: 100%;
            transition: width 0.1s linear;
        }

        /* 戰鬥舞台區 */
        .battle-stage {
            flex: 1;
            position: relative;
            width: 100%;
        }
        .character {
            position: absolute;
            bottom: 20px;
            font-size: 80px;
            transition: all 0.3s ease;
        }
        .mermaid {
            left: 10%;
            filter: drop-shadow(0 0 15px rgba(0,255,255,0.8));
        }
        .monster {
            right: 15%;
            filter: drop-shadow(0 0 15px rgba(255,0,0,0.5));
        }
        .boss {
            transform: scale(1.5);
            filter: drop-shadow(0 0 25px rgba(255,0,0,0.8));
        }

        /* 人魚公主對話框 */
        .speech-bubble {
            position: absolute;
            bottom: 120px;
            left: 8%;
            background: white;
            color: #ff1493;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        /* 底部操作區 */
        .bottom-controls {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            gap: 15px;
        }
        .answer-btn {
            background: linear-gradient(to bottom, #feca57, #ff9f43);
            border: 3px solid #fff;
            border-radius: 20px;
            width: 100px;
            height: 100px;
            font-size: 40px;
            font-weight: 900;
            color: #2f3640;
            cursor: pointer;
            box-shadow: 0 8px 0 #ee5253;
        }
        .answer-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #ee5253;
        }

        /* 動畫特效 */
        @keyframes attack {
            0% { transform: translateX(0); }
            50% { transform: translateX(30px) rotate(15deg); }
            100% { transform: translateX(0); }
        }
        @keyframes hurt {
            0% { transform: translateX(0); filter: brightness(1) hue-rotate(0deg); }
            20% { transform: translateX(-10px); filter: brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(5); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); filter: brightness(1); }
        }
        .anim-attack { animation: attack 0.4s ease; }
        .anim-hurt { animation: hurt 0.5s ease; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 主畫面 -->
    <div id="main-screen" class="screen active">
        <h1>重返亞特蘭提斯<br>人魚公主與數靈聖域</h1>
        <div class="subtitle">✨ 魔法少女 x 九九乘法 ✨</div>
        <button class="btn" onclick="showScreen('level-screen')">開始冒險</button>
    </div>

    <!-- 關卡選擇 -->
    <div id="level-screen" class="screen">
        <h2 style="color: #00ffcc;">選擇關卡</h2>
        <div class="level-grid" id="level-grid">
            <!-- JS 動態生成 1~9 關 -->
        </div>
        <button class="btn" style="margin-top: 30px; font-size: 16px; padding: 10px 20px;" onclick="showScreen('main-screen')">返回</button>
    </div>

    <!-- 遊戲進行畫面 -->
    <div id="gameplay-screen" class="screen" style="background: transparent;">
        <div class="top-bar">
            <div class="hp-bar" id="ui-hp">❤️❤️❤️</div>
            <div class="progress-bar" id="ui-progress">距離 Boss: 0/10</div>
        </div>

        <div class="question-area">
            <div id="ui-question">2 x 3 = ?</div>
            <div class="timer-bar-container">
                <div class="timer-bar" id="ui-timer"></div>
            </div>
        </div>

        <div class="battle-stage">
            <div class="character mermaid" id="char-mermaid">🧜‍♀️</div>
            <div class="speech-bubble" id="ui-speech">準備好了嗎？</div>
            <div class="character monster" id="char-monster">🐟</div>
        </div>

        <div class="bottom-controls">
            <button class="answer-btn" onclick="checkAnswer(0)" id="btn-ans-0">1</button>
            <button class="answer-btn" onclick="checkAnswer(1)" id="btn-ans-1">2</button>
            <button class="answer-btn" onclick="checkAnswer(2)" id="btn-ans-2">3</button>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="screen">
        <h1 id="result-title">關卡完成！</h1>
        <div class="subtitle" id="result-desc">星光魔法淨化了海怪！</div>
        <button class="btn" onclick="showScreen('level-screen')">回到關卡選擇</button>
    </div>
</div>

<script>
    // 遊戲狀態與設定
    let gameState = {
        level: 1,
        hp: 3,
        progress: 0,
        maxProgress: 10,
        isBoss: false,
        bossHp: 3,
        correctAnswer: 0,
        timer: 10,
        timerInterval: null
    };

    // 海怪設定 (對應1~9關)
    const monsters = ["🐟","🐍","🦀","🐡","🌟","🦑","🦈","🐙","👿"];

    // 初始化關卡選擇
    const levelGrid = document.getElementById('level-grid');
    for(let i = 1; i <= 9; i++) {
        let btn = document.createElement('button');
        btn.className = 'level-btn';
        btn.innerText = `第 ${i} 關\n(x${i})`;
        btn.onclick = () => startGame(i);
        levelGrid.appendChild(btn);
    }

    // 畫面切換
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(screenId === 'gameplay-screen') {
            document.getElementById('gameplay-screen').style.display = 'flex';
        }
    }

    // 顯示公主對話
    function showSpeech(text, isGood = true) {
        const bubble = document.getElementById('ui-speech');
        bubble.innerText = text;
        bubble.style.color = isGood ? '#ff1493' : '#3742fa';
        bubble.style.opacity = 1;
        setTimeout(() => { bubble.style.opacity = 0; }, 2000);
    }

    // 開始遊戲
    function startGame(level) {
        gameState.level = level;
        gameState.hp = 3;
        gameState.progress = 0;
        gameState.isBoss = false;
        gameState.bossHp = 3;
        
        document.getElementById('char-monster').innerText = monsters[level-1];
        document.getElementById('char-monster').className = 'character monster';
        
        updateUI();
        showScreen('gameplay-screen');
        showSpeech("星光魔法，出擊！✨");
        generateQuestion();
    }

    // 產生題目
    function generateQuestion() {
        resetTimer();
        
        const num1 = gameState.level;
        const num2 = Math.floor(Math.random() * 9) + 1; // 1~9
        const answer = num1 * num2;
        
        document.getElementById('ui-question').innerText = `${num1} x ${num2} = ?`;
        
        // 產生錯誤選項
        let wrong1 = answer + (Math.floor(Math.random() * 5) + 1);
        let wrong2 = answer - (Math.floor(Math.random() * 5) + 1);
        if(wrong2 <= 0) wrong2 = answer + 6;
        if(wrong1 === wrong2) wrong1 += 2;

        let options = [answer, wrong1, wrong2];
        options.sort(() => Math.random() - 0.5); // 隨機打亂

        gameState.correctAnswer = answer;

        for(let i=0; i<3; i++) {
            document.getElementById(`btn-ans-${i}`).innerText = options[i];
        }
    }

    // 計時器
    function resetTimer() {
        clearInterval(gameState.timerInterval);
        gameState.timer = 100;
        const timerBar = document.getElementById('ui-timer');
        timerBar.style.width = '100%';
        timerBar.style.background = '#00ffcc';

        gameState.timerInterval = setInterval(() => {
            gameState.timer -= 1; /* 100 = 約10秒 */
            timerBar.style.width = gameState.timer + '%';
            
            if(gameState.timer < 30) timerBar.style.background = '#ff4757';
            
            if(gameState.timer <= 0) {
                clearInterval(gameState.timerInterval);
                handleWrong("時間到！");
            }
        }, 100);
    }

    // 檢查答案
    function checkAnswer(btnIndex) {
        clearInterval(gameState.timerInterval);
        const selected = parseInt(document.getElementById(`btn-ans-${btnIndex}`).innerText);
        
        const mermaid = document.getElementById('char-mermaid');
        mermaid.classList.remove('anim-attack', 'anim-hurt');
        void mermaid.offsetWidth; // trigger reflow

        if(selected === gameState.correctAnswer) {
            handleCorrect();
        } else {
            handleWrong("哎呀，答錯了！");
        }
    }

    // 答對邏輯
    function handleCorrect() {
        const mermaid = document.getElementById('char-mermaid');
        const monster = document.getElementById('char-monster');
        
        mermaid.classList.add('anim-attack');
        showSpeech(["太棒了！", "答對了！", "真理魔法！"][Math.floor(Math.random()*3)], true);
        
        // 怪物受擊閃爍
        monster.style.opacity = 0.5;
        setTimeout(() => monster.style.opacity = 1, 200);

        if(gameState.isBoss) {
            gameState.bossHp--;
            if(gameState.bossHp <= 0) {
                endGame(true);
                return;
            }
        } else {
            gameState.progress++;
            if(gameState.progress >= gameState.maxProgress) {
                triggerBoss();
                return;
            }
        }
        
        updateUI();
        setTimeout(generateQuestion, 600);
    }

    // 答錯邏輯
    function handleWrong(msg) {
        const mermaid = document.getElementById('char-mermaid');
        mermaid.classList.add('anim-hurt');
        
        gameState.hp--;
        showSpeech(msg + " 加油不要放棄！", false);
        updateUI();

        if(gameState.hp <= 0) {
            endGame(false);
        } else {
            setTimeout(generateQuestion, 1000);
        }
    }

    // 進入Boss戰
    function triggerBoss() {
        gameState.isBoss = true;
        const monster = document.getElementById('char-monster');
        monster.classList.add('boss');
        showSpeech("小心！數字海怪Boss出現了！", false);
        updateUI();
        setTimeout(generateQuestion, 1500);
    }

    // 更新介面
    function updateUI() {
        document.getElementById('ui-hp').innerText = '❤️'.repeat(gameState.hp) + '🖤'.repeat(3 - gameState.hp);
        
        if(gameState.isBoss) {
            document.getElementById('ui-progress').innerText = `Boss 血量: ${gameState.bossHp}/3`;
        } else {
            document.getElementById('ui-progress').innerText = `距離 Boss: ${gameState.progress}/${gameState.maxProgress}`;
        }
    }

    // 遊戲結束結算
    function endGame(isWin) {
        clearInterval(gameState.timerInterval);
        const title = document.getElementById('result-title');
        const desc = document.getElementById('result-desc');
        
        if(isWin) {
            title.innerText = "⭐ 關卡完成！ ⭐";
            title.style.color = "#ffeb3b";
            desc.innerText = "星光魔法成功淨化了海怪，海洋夥伴得救了！";
        } else {
            title.innerText = "💧 挑戰失敗 💧";
            title.style.color = "#ff4757";
            desc.innerText = "魔法愛心消耗殆盡，稍微休息一下再出發吧！";
        }
        
        setTimeout(() => showScreen('result-screen'), 1000);
    }
</script>
</body>
</html>
