<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重返亞特蘭提斯：人魚公主與數靈聖域</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        * { box-sizing: border-box; user-select: none; font-family: 'Noto Sans TC', sans-serif; }
        body { margin: 0; padding: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: #fff; }

        #game-container {
            position: relative; width: 100%; max-width: 900px; height: 100%; max-height: 550px;
            border-radius: 15px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.5); overflow: hidden; display: flex; flex-direction: column;
            background-color: #0d1b2a;
        }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: flex-start; align-items: center; z-index: 10; background-size: cover; background-position: center; overflow-y: auto; padding: 20px 0; }
        .screen.active { display: flex; }
        
        #main-screen, #level-screen, #gallery-screen { background-image: url('images/bg-main.jpg'); background-color: #1a2a6c; justify-content: center; }
        #gameplay-screen { background-image: url('images/bg-underwater.jpg'); background-color: #000851; z-index: 5; justify-content: space-between; padding: 0; overflow: hidden;}
        #result-screen { background-image: url('images/bg-result.jpg'); background-color: rgba(0,0,0,0.8); justify-content: center;}

        h1 { font-size: 32px; color: #fff; text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493, 2px 2px 4px #000; text-align: center; margin-bottom: 10px; line-height: 1.2; }
        .subtitle { font-size: 18px; color: #fff; text-shadow: 1px 1px 3px #000; margin-bottom: 30px; }

        #music-btn {
            position: absolute; top: 15px; right: 15px; z-index: 20; background: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 20px;
            color: #fff; padding: 8px 15px; font-size: 14px; cursor: pointer; font-weight: bold;
        }

        .btn {
            background-image: url('images/btn-primary.png'); background-color: #ff69b4; background-size: 100% 100%; background-position: center;
            border: 2px solid #fff; border-radius: 30px; width: 220px; height: 60px; font-size: 20px; color: white; font-weight: bold; text-shadow: 1px 1px 2px #000; cursor: pointer; transition: transform 0.1s; display: flex; justify-content: center; align-items: center; margin-bottom: 15px;
        }
        .btn:active { transform: scale(0.95); }

        .level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; padding: 0 20px;}
        .level-btn {
            background-image: url('images/btn-level.png'); background-color: #1e90ff; background-size: 100% 100%;
            border: 2px solid #87cefa; border-radius: 15px; width: 85px; height: 85px; font-size: 16px; color: white; font-weight: bold; text-shadow: 1px 1px 3px #000; cursor: pointer; display: flex; justify-content: center; align-items: center; text-align: center; line-height: 1.3;
        }
        .level-btn:active { transform: scale(0.95); }
        .level-btn.locked { filter: grayscale(100%) brightness(0.5); cursor: not-allowed; border-color: #555; }

        /* 戰鬥頂部資訊 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 25px; width: 100%; background: rgba(0,0,0,0.5); }
        .hp-section { display: flex; align-items: center; gap: 5px; }
        .hp-icon { width: 30px; height: 30px; }
        /* 裝備夥伴的頭像顯示 */
        .partner-icon { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ffeb3b; background: rgba(255,255,255,0.2); margin-right: 10px; display: none; object-fit: contain; }
        .progress-bar { font-size: 16px; color: #f1c40f; font-weight: bold; text-shadow: 1px 1px 2px #000;}

        .question-area { text-align: center; font-size: 45px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #00ffff, 2px 2px 5px #000; margin-top: -10px; transition: all 0.2s;}
        .timer-bar-container { width: 250px; height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; margin: 10px auto; overflow: hidden; border: 1px solid #fff; }
        .timer-bar { height: 100%; background: #00ffcc; width: 100%; }
        
        .interference { animation: shake-blur 0.5s infinite alternate; }
        @keyframes shake-blur { 
            0% { transform: translate(2px, 1px) rotate(0deg); filter: blur(0px); }
            100% { transform: translate(-1px, -2px) rotate(-2deg); filter: blur(3px) hue-rotate(90deg); color: #ffeb3b;} 
        }

        .battle-stage { flex: 1; position: relative; width: 100%; }
        .character { position: absolute; bottom: 20px; transition: all 0.3s ease; height: auto; object-fit: contain; }
        .mermaid { left: 10%; width: 180px; font-size: 70px;} 
        .monster { right: 10%; width: 150px; font-size: 70px;}
        .boss { width: 220px; filter: drop-shadow(0 0 20px rgba(255,0,0,0.8)); transform: scale(1.2); }

        .speech-bubble {
            position: absolute; bottom: 180px; left: 15%; width: 180px; height: 75px;
            background-image: url('images/ui-speech-bg.png'); background-color: rgba(255,255,255,0.9); border-radius: 15px;
            display: flex; justify-content: center; align-items: center; text-align: center; color: #1e3799; font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s; line-height: 1.2; padding: 5px;
        }

        .bottom-controls { display: flex; justify-content: flex-end; padding: 15px 30px; gap: 15px; background: rgba(0,0,0,0.4); }
        .answer-btn {
            background-image: url('images/btn-answer.png'); background-color: #feca57; border: 3px solid #fff; border-radius: 50%;
            width: 80px; height: 80px; font-size: 32px; font-weight: 900; color: #fff; text-shadow: 2px 2px 5px #000; cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .answer-btn:active { transform: scale(0.9); }

        /* 相簿與夥伴系統 */
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 85%; max-height: 50%; overflow-y: auto; padding: 15px; background: rgba(0,0,0,0.5); border-radius: 10px;}
        .card { position: relative; width: 100%; aspect-ratio: 1; background: #333; border: 2px solid #fff; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 40px; color: #fff; cursor: pointer; overflow: hidden; transition: transform 0.1s;}
        .card:active { transform: scale(0.95); }
        .card.locked { background: #222; color: #555; cursor: not-allowed; }
        .card.equipped { border: 4px solid #00ffcc; box-shadow: 0 0 15px #00ffcc; }
        .equip-tag { position: absolute; bottom: 0; left: 0; width: 100%; background: #00ffcc; color: #000; font-size: 12px; font-weight: bold; text-align: center; padding: 2px 0; }
        .buff-desc { position: absolute; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; text-align: center; padding: 2px 0; }
        
        .special-modes { display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px; border-top: 2px dashed #fff; padding-top: 15px; margin-bottom: 15px;}
        
        .anim-attack { animation: attack 0.3s ease; }
        .anim-hurt { animation: hurt 0.5s ease; }
        @keyframes attack { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(30px); } }
        @keyframes hurt { 0%, 100% { transform: translateX(0); filter: brightness(1); } 50% { transform: translateX(-15px); filter: brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(5); } }
    </style>
</head>
<body>

<audio id="bgm" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

<div id="game-container">
    <button id="music-btn" onclick="toggleMusic()">🎵 音樂: 關</button>

    <div id="main-screen" class="screen active">
        <h1>重返亞特蘭提斯<br>人魚公主與數靈聖域</h1>
        <div class="subtitle">✨ 魔法少女 x 九九乘法 ✨</div>
        <button class="btn" onclick="firstStart()">開始冒險</button>
        <button class="btn" onclick="showGallery()" style="background-color: #9b59b6;">夢幻相簿 & 夥伴裝備</button>
    </div>

    <div id="level-screen" class="screen">
        <h2 style="color: #fff; text-shadow: 2px 2px 5px #000; margin-top: 0; margin-bottom: 10px;">選擇關卡</h2>
        <div class="level-grid" id="level-grid"></div>
        
        <div class="special-modes" id="special-modes-ui">
            <label style="font-size: 16px; color: #ffeb3b; font-weight: bold; cursor: pointer;">
                <input type="checkbox" id="hard-mode-toggle" style="transform: scale(1.3); margin-right: 5px;"> 🔥 開啟進階難度 (海怪干擾)
            </label>
            <button class="btn" onclick="startEndlessMode()" style="background-color: #e74c3c; width: 220px;">♾️ 無限大挑戰</button>
        </div>
        <button class="btn" style="width: 150px; background-color: #555;" onclick="showScreen('main-screen')">返回</button>
    </div>

    <!-- 夢幻相簿 -->
    <div id="gallery-screen" class="screen">
        <h2 style="color: #fff; text-shadow: 2px 2px 5px #000; margin-top:0; margin-bottom: 5px;">星光好朋友相簿</h2>
        <div style="font-size: 14px; margin-bottom: 10px;">點擊已解鎖的卡牌來裝備夥伴 Buff</div>
        <div class="gallery-grid" id="gallery-grid"></div>
        <button class="btn" style="margin-top: 20px; width: 150px; background-color: #555;" onclick="showScreen('main-screen')">返回</button>
    </div>

    <!-- 遊戲畫面 -->
    <div id="gameplay-screen" class="screen">
        <div class="top-bar">
            <div class="hp-section">
                <!-- 夥伴頭像 -->
                <img src="" id="ui-partner-icon" class="partner-icon">
                <div id="ui-hp"></div>
            </div>
            <div class="progress-bar" id="ui-progress">距離 Boss: 0/10</div>
        </div>
        <div class="question-area">
            <div id="ui-question">2 x 3 = ?</div>
            <div class="timer-bar-container"><div class="timer-bar" id="ui-timer"></div></div>
        </div>
        <div class="battle-stage">
            <img src="images/char-mermaid.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="character mermaid" id="char-mermaid">
            <div style="display:none; font-size: 70px;" class="character mermaid" id="fallback-mermaid">🧜‍♀️</div>
            
            <div class="speech-bubble" id="ui-speech">準備好了嗎？</div>
            
            <img src="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="character monster" id="char-monster">
            <div style="display:none; font-size: 70px;" class="character monster" id="fallback-monster">👾</div>
        </div>
        <div class="bottom-controls">
            <button class="answer-btn" onclick="checkAnswer(0)" id="btn-ans-0">1</button>
            <button class="answer-btn" onclick="checkAnswer(1)" id="btn-ans-1">2</button>
            <button class="answer-btn" onclick="checkAnswer(2)" id="btn-ans-2">3</button>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="screen">
        <h1 id="result-title">關卡完成！</h1>
        <div class="subtitle" id="result-desc"></div>
        <button class="btn" onclick="showScreen('level-screen')">確認</button>
    </div>
</div>

<script>
    // --- 音樂系統 ---
    let isMusicPlaying = false;
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-btn');
    function toggleMusic() {
        if (isMusicPlaying) {
            bgm.pause(); musicBtn.innerText = "🎵 音樂: 關"; isMusicPlaying = false;
        } else {
            bgm.play().then(() => { musicBtn.innerText = "🎵 音樂: 開"; isMusicPlaying = true; }).catch(e => { console.log("瀏覽器擋住了自動播放"); });
        }
    }
    function firstStart() {
        if (!isMusicPlaying) toggleMusic();
        showScreen('level-screen');
    }

    // --- 遊戲邏輯與存檔 ---
    let saveFile = JSON.parse(localStorage.getItem('mermaidSave')) || { unlockedLevel: 1, unlockedCards: [], equippedPartner: null };
    // 確保舊存檔有 equippedPartner 欄位
    if(saveFile.equippedPartner === undefined) saveFile.equippedPartner = null;

    let state = { 
        level: 1, hp: 3, maxHp: 3, progress: 0, maxProgress: 10, 
        isBoss: false, bossHp: 3, baseBossHp: 3, 
        correctAnswer: 0, timer: 100, timerInterval: null, 
        isEndless: false, isHardMode: false, endlessScore: 0,
        timeBuff: false
    };

    const monsters = ["🐟","🐍","🦀","🐡","🌟","🦑","🦈","🐙","👿"]; 
    const monsterImg = ["monster-1.png", "monster-2.png", "monster-3.png", "monster-4.png", "monster-5.png", "monster-6.png", "monster-7.png", "monster-8.png", "monster-9.png"];
    
    // 定義 3 種 Buff
    const buffNames = ["生命守護<br>(愛心+1)", "時間魔法<br>(變慢25%)", "強力打擊<br>(Boss血-1)"];

    function saveData() { localStorage.setItem('mermaidSave', JSON.stringify(saveFile)); updateLevelUI(); }

    function updateLevelUI() {
        const grid = document.getElementById('level-grid');
        grid.innerHTML = '';
        for(let i = 1; i <= 9; i++) {
            let btn = document.createElement('button');
            if (i <= saveFile.unlockedLevel) {
                btn.className = 'level-btn'; btn.innerHTML = `第 ${i} 關<br>(x${i})`; btn.onclick = () => startGame(i, false);
            } else {
                btn.className = 'level-btn locked'; btn.innerHTML = `🔒<br>未解鎖`;
            }
            grid.appendChild(btn);
        }
        document.getElementById('special-modes-ui').style.display = saveFile.unlockedLevel > 9 ? 'flex' : 'none';
    }
    updateLevelUI();

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById(id).scrollTop = 0; 
    }

    // --- 夥伴相簿系統 ---
    function showGallery() {
        const grid = document.getElementById('gallery-grid');
        grid.innerHTML = '';
        for(let i = 0; i < 9; i++) {
            let card = document.createElement('div');
            let buffType = i % 3; // 0=HP, 1=Time, 2=Atk

            if (saveFile.unlockedCards.includes(i)) {
                card.className = 'card';
                if (saveFile.equippedPartner === i) card.classList.add('equipped');
                
                card.innerHTML = `
                    <div class="buff-desc">${buffNames[buffType].replace('<br>',' ')}</div>
                    <img src="images/${monsterImg[i]}" style="width:60%;" onerror="this.outerHTML='${monsters[i]}'">
                    ${saveFile.equippedPartner === i ? '<div class="equip-tag">✅ 已裝備</div>' : ''}
                `;
                card.onclick = () => equipPartner(i);
            } else {
                card.className = 'card locked';
                card.innerHTML = '🔒';
            }
            grid.appendChild(card);
        }
        showScreen('gallery-screen');
    }

    function equipPartner(index) {
        if(saveFile.equippedPartner === index) {
            saveFile.equippedPartner = null; // 取消裝備
        } else {
            saveFile.equippedPartner = index; // 裝備
        }
        saveData();
        showGallery(); // 重新渲染相簿
    }

    function showSpeech(text, isGood = true) {
        const bubble = document.getElementById('ui-speech');
        bubble.innerHTML = text; bubble.style.color = isGood ? '#e84118' : '#273c75'; 
        bubble.style.opacity = 1; setTimeout(() => { bubble.style.opacity = 0; }, 2500);
    }

    function updateUI() {
        let hpHTML = "";
        for(let i = 0; i < state.maxHp; i++) {
            if(i < state.hp) hpHTML += `<img src="images/icon-heart-full.png" class="hp-icon" onerror="this.outerHTML='❤️'">`;
            else hpHTML += `<img src="images/icon-heart-empty.png" class="hp-icon" onerror="this.outerHTML='🖤'">`;
        }
        document.getElementById('ui-hp').innerHTML = hpHTML;
        
        if (state.isEndless) {
            document.getElementById('ui-progress').innerText = state.isBoss ? `Boss 血量: ${state.bossHp}/${state.baseBossHp}` : `擊退海怪: ${state.endlessScore}`;
        } else {
            document.getElementById('ui-progress').innerText = state.isBoss ? `Boss 血量: ${state.bossHp}/${state.baseBossHp}` : `距離 Boss: ${state.progress}/${state.maxProgress}`;
        }
    }

    // --- 初始化戰鬥與 Buff ---
    function applyBuffs() {
        state.maxHp = 3;
        state.baseBossHp = 3;
        state.timeBuff = false;
        
        const pIcon = document.getElementById('ui-partner-icon');
        let buffMsg = "星光魔法，出擊！✨";

        if(saveFile.equippedPartner !== null) {
            let pType = saveFile.equippedPartner % 3;
            if(pType === 0) { state.maxHp = 4; buffMsg = "發動夥伴技能：<br>💖 生命守護！"; }
            if(pType === 1) { state.timeBuff = true; buffMsg = "發動夥伴技能：<br>⏳ 時間變慢！"; }
            if(pType === 2) { state.baseBossHp = 2; buffMsg = "發動夥伴技能：<br>⚔️ Boss血量-1！"; }
            
            // 顯示夥伴頭像
            pIcon.style.display = "block";
            pIcon.src = `images/${monsterImg[saveFile.equippedPartner]}`;
            // 簡單處理沒有圖素時的情況
            pIcon.onerror = function() { this.style.display='none'; } 
        } else {
            pIcon.style.display = "none";
        }
        
        state.hp = state.maxHp;
        return buffMsg;
    }

    function startGame(level) {
        state.level = level; state.progress = 0; state.isBoss = false; state.isEndless = false;
        state.isHardMode = document.getElementById('hard-mode-toggle').checked && saveFile.unlockedLevel > 9;
        
        let startMsg = applyBuffs();
        if(state.isHardMode) startMsg = "進階難度！小心干擾！";

        setupMonster(level - 1);
        updateUI(); showScreen('gameplay-screen'); showSpeech(startMsg);
        generateQuestion();
    }

    function startEndlessMode() {
        state.level = 'endless'; state.progress = 0; state.endlessScore = 0; state.isBoss = false; state.isEndless = true; state.isHardMode = false;
        
        let startMsg = applyBuffs();
        setupMonster(Math.floor(Math.random() * 9));
        updateUI(); showScreen('gameplay-screen'); showSpeech(startMsg + "<br>無限挑戰開始！");
        generateQuestion();
    }

    function setupMonster(index) {
        document.getElementById('char-monster').src = `images/${monsterImg[index]}`;
        document.getElementById('fallback-monster').innerText = monsters[index];
        document.getElementById('char-monster').className = 'character monster';
        document.getElementById('fallback-monster').className = 'character monster';
    }

    function generateQuestion() {
        resetTimer();
        let num1 = state.isEndless ? Math.floor(Math.random() * 9) + 1 : state.level;
        let num2 = Math.floor(Math.random() * 9) + 1;
        state.correctAnswer = num1 * num2;
        
        const qArea = document.getElementById('ui-question');
        qArea.innerText = `${num1} x ${num2} = ?`;
        if (state.isHardMode && Math.random() > 0.5) qArea.classList.add('interference');
        else qArea.classList.remove('interference');

        let wrong1 = state.correctAnswer + (Math.floor(Math.random() * 5) + 1);
        let wrong2 = state.correctAnswer - (Math.floor(Math.random() * 5) + 1);
        if(wrong2 <= 0) wrong2 = state.correctAnswer + 6; if(wrong1 === wrong2) wrong1 += 2;

        let options = [state.correctAnswer, wrong1, wrong2].sort(() => Math.random() - 0.5);
        for(let i=0; i<3; i++) document.getElementById(`btn-ans-${i}`).innerText = options[i];
    }

    function resetTimer() {
        clearInterval(state.timerInterval);
        state.timer = 100;
        const timerBar = document.getElementById('ui-timer');
        timerBar.style.width = '100%'; timerBar.style.background = '#00ffcc';
        
        let speed = (state.isHardMode || state.isEndless) ? 60 : 100;
        if(state.timeBuff) speed = Math.floor(speed * 1.25); // 時間魔法：變慢 25%

        state.timerInterval = setInterval(() => {
            state.timer -= 1;
            timerBar.style.width = state.timer + '%';
            if(state.timer < 30) timerBar.style.background = '#ff4757';
            if(state.timer <= 0) { clearInterval(state.timerInterval); handleWrong("時間到！"); }
        }, speed);
    }

    function checkAnswer(btnIndex) {
        clearInterval(state.timerInterval);
        document.getElementById('ui-question').classList.remove('interference'); 
        const selected = parseInt(document.getElementById(`btn-ans-${btnIndex}`).innerText);
        
        let mermaid = document.getElementById('char-mermaid');
        if(mermaid.style.display === 'none') mermaid = document.getElementById('fallback-mermaid');
        mermaid.classList.remove('anim-attack', 'anim-hurt'); void mermaid.offsetWidth;

        if(selected === state.correctAnswer) handleCorrect(mermaid);
        else handleWrong("哎呀，答錯了！", mermaid);
    }

    function handleCorrect(mermaid) {
        mermaid.classList.add('anim-attack');
        showSpeech(["太棒了！", "答對了！", "真理魔法！"][Math.floor(Math.random()*3)], true);
        
        let monster = document.getElementById('char-monster');
        if(monster.style.display === 'none') monster = document.getElementById('fallback-monster');
        monster.style.opacity = 0.3; setTimeout(() => monster.style.opacity = 1, 200);

        if (state.isEndless) {
            if (state.isBoss) {
                state.bossHp--;
                if(state.bossHp <= 0) {
                    if (state.hp < state.maxHp) state.hp++; 
                    showSpeech("擊退Boss！愛心回復！");
                    state.isBoss = false; setupMonster(Math.floor(Math.random() * 9));
                }
            } else {
                state.endlessScore++;
                if (state.endlessScore > 0 && state.endlessScore % 10 === 0) triggerBoss();
                else setupMonster(Math.floor(Math.random() * 9)); 
            }
            updateUI(); setTimeout(generateQuestion, 600);
            return;
        }

        if(state.isBoss) {
            state.bossHp--;
            if(state.bossHp <= 0) endGame(true);
        } else {
            state.progress++;
            if(state.progress >= state.maxProgress) triggerBoss();
        }
        updateUI(); setTimeout(generateQuestion, 600);
    }

    function handleWrong(msg, mermaid) {
        if(!mermaid) mermaid = document.getElementById('char-mermaid');
        mermaid.classList.add('anim-hurt');
        state.hp--; showSpeech(msg + "<br>加油！", false); updateUI();
        if(state.hp <= 0) endGame(false);
        else setTimeout(generateQuestion, 1000);
    }

    function triggerBoss() {
        state.isBoss = true; state.bossHp = state.baseBossHp; // 根據有無 Buff 決定血量
        if (state.isEndless) setupMonster(8); 
        let monster = document.getElementById('char-monster');
        if(monster.style.display === 'none') monster = document.getElementById('fallback-monster');
        monster.classList.add('boss');
        showSpeech("警告！海怪Boss來襲！", false); updateUI(); setTimeout(generateQuestion, 1500);
    }

    function endGame(isWin) {
        clearInterval(state.timerInterval);
        const title = document.getElementById('result-title');
        const desc = document.getElementById('result-desc');
        
        if (state.isEndless) {
            title.innerText = "⭐ 挑戰結束 ⭐"; title.style.color = "#ffeb3b";
            desc.innerHTML = `你總共淨化了 <b style="color:#00ffcc; font-size:30px;">${state.endlessScore}</b> 隻海怪！`;
        } else if(isWin) {
            title.innerText = "⭐ 關卡完成！ ⭐"; title.style.color = "#ffeb3b";
            
            if (!saveFile.unlockedCards.includes(state.level - 1)) {
                desc.innerHTML = `星光魔法成功淨化了海怪！<br><span style="color:#00ffcc;">獲得了新夥伴，可以到相簿裝備囉！</span>`;
                saveFile.unlockedCards.push(state.level - 1);
            } else {
                desc.innerHTML = `星光魔法成功淨化了海怪！`;
            }
            
            if (state.level === saveFile.unlockedLevel) saveFile.unlockedLevel++;
            saveData();
        } else {
            title.innerText = "💧 挑戰失敗 💧"; title.style.color = "#ff4757";
            desc.innerText = "魔法愛心消耗殆盡，稍微休息一下再出發吧！";
        }
        setTimeout(() => showScreen('result-screen'), 1000);
    }
</script>
</body>
</html>
