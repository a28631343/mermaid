    function startGame(level) {
        if ((level === 10 && saveFile.unlockedLevel < 10) || (level === 20 && saveFile.unlockedLevel < 20)) {
            alert("此大魔王關卡尚未解鎖！"); return;
        }

        clearAllTimers(); updateBattleAvatar(); 
        state.level = level; state.monstersDefeated = 0; state.isBoss = false; 
        state.isEndless = false; state.isPractice = false;
        state.sessionPearls = 0; state.isFirstClear = (level === saveFile.unlockedLevel); 
        currentBgPosX = 0; document.getElementById('battle-stage-bg').style.backgroundPosition = '0vw top';

        let startMsg = applyBuffs(); state.monsterMaxHp = 2; 
        
        if (level === 10) { state.isHardMode = true; state.baseBossHp += 7; state.maxMonsters = 8; }
        else if (level === 20) { state.isHardMode = true; state.baseBossHp += 12; state.maxMonsters = 5; }
        else if (level > 10) { state.isHardMode = true; state.baseBossHp += 2; state.maxMonsters = 5; }
        else { state.isHardMode = false; state.maxMonsters = 3; }

        document.getElementById('monster-ui').style.display = 'none'; state.monsterHp = state.monsterMaxHp;
        const pearlUI = document.getElementById('global-pearl-ui'); if (pearlUI) pearlUI.style.display = 'none'; 
        showScreen('gameplay-screen', 'RESOLVING'); 
        
        triggerPartnerEntry(startMsg, () => {
            if(saveFile.equippedPartner === null) {
                showSpeech(level >= 10 ? "最終決戰！<br>打倒大魔王！" : "星光魔法，出擊！✨");
            }
            document.getElementById('char-monster').style.display = 'block';
            spawnNextMonster(true, () => { gameState = 'PLAYING'; generateQuestion(); }); 
            updateUI(); 
        });
    }

    function startEndlessMode() {
        clearAllTimers(); updateBattleAvatar(); 
        state.level = 'endless'; state.monstersDefeated = 0; state.endlessScore = 0; state.isBoss = false; 
        state.isEndless = true; state.isPractice = false; state.isHardMode = true; state.sessionPearls = 0;
        currentBgPosX = 0; document.getElementById('battle-stage-bg').style.backgroundPosition = '0vw top';

        let startMsg = applyBuffs(); state.monsterMaxHp = 2; state.monsterHp = state.monsterMaxHp;
        document.getElementById('monster-ui').style.display = 'none';
        const pearlUI = document.getElementById('global-pearl-ui'); if (pearlUI) pearlUI.style.display = 'none';
        
        showScreen('gameplay-screen', 'RESOLVING'); 
        triggerPartnerEntry(startMsg, () => {
            if(saveFile.equippedPartner === null) showSpeech("無限挑戰開始！");
            document.getElementById('char-monster').style.display = 'block';
            spawnNextMonster(true, () => { gameState = 'PLAYING'; generateQuestion(); });
            updateUI(); 
        });
    }

    function startPracticeGame(practiceMaxNum) {
        clearAllTimers(); updateBattleAvatar();
        state.level = 'practice'; state.monstersDefeated = 0; state.endlessScore = 0; state.isBoss = false; 
        state.isEndless = false; state.isPractice = true; state.isHardMode = false;
        state.sessionPearls = 0; state.practiceRange = practiceMaxNum; 
        currentBgPosX = 0; document.getElementById('battle-stage-bg').style.backgroundPosition = '0vw top';

        let startMsg = applyBuffs(); state.monsterMaxHp = 1; state.monsterHp = 1;
        document.getElementById('monster-ui').style.display = 'none';
        showScreen('gameplay-screen', 'RESOLVING'); 
        
        triggerPartnerEntry(startMsg, () => {
            showSpeech(`專注練習 1~${practiceMaxNum} 乘法！`);
            document.getElementById('char-monster').style.display = 'block';
            spawnNextMonster(true, () => { gameState = 'PLAYING'; generateQuestion(); });
            updateUI(); 
        });
    }

    function spawnNextMonster(isFirstSpawn = false, callback = null) {
        const gameplayBg = document.getElementById('battle-stage-bg');
        const mermaid = document.getElementById('char-mermaid');
        const partnerContainer = document.getElementById('char-partner-container');
        
        mermaid.classList.remove('anim-mermaid-enter', 'anim-mermaid-run', 'anim-attack', 'anim-hurt');
        partnerContainer.classList.remove('anim-mermaid-enter', 'anim-mermaid-run', 'anim-partner-atk');
        void mermaid.offsetWidth; void partnerContainer.offsetWidth;

        if (isFirstSpawn) {
            mermaid.classList.add('anim-mermaid-enter');
            if(saveFile.equippedPartner !== null) partnerContainer.classList.add('anim-mermaid-enter');
        } else {
            currentBgPosX -= 15; gameplayBg.style.backgroundPosition = `${currentBgPosX}vw top`;
            mermaid.classList.add('anim-mermaid-run');
            if(saveFile.equippedPartner !== null) partnerContainer.classList.add('anim-mermaid-run');
        }

        let mobIndex = 0; let actualLevel = state.level; let isBossAsMob = false;
        if (actualLevel === 'endless') mobIndex = Math.floor(Math.random() * 3); 
        else if (actualLevel === 20) { mobIndex = Math.floor(Math.random() * 9); isBossAsMob = true; }
        else if (actualLevel === 10) mobIndex = Math.floor(Math.random() * 3);
        else if (actualLevel === 'practice') {  } 
        else {
            if (actualLevel > 10) actualLevel -= 10; 
            if (actualLevel <= 3) mobIndex = 0; else if (actualLevel <= 6) mobIndex = 1; else mobIndex = 2;                       
        }

        let isElite = state.isEndless ? (state.endlessScore % 5 === 4) : (!state.isPractice && state.monstersDefeated === state.maxMonsters - 1);
        
        safeSetTimeout(() => {
            if (state.level === 'practice') setupSprite('practice', 0, false, isFirstSpawn);
            else if (isBossAsMob) setupSprite('boss-as-mob', mobIndex, isElite, isFirstSpawn);
            else setupSprite('mob', mobIndex, isElite, isFirstSpawn);

            document.getElementById('monster-hp-fill').style.width = '100%';
            if(!state.isPractice) document.getElementById('monster-ui').style.display = 'block';
            if (callback) callback();
        }, isFirstSpawn ? 0 : 400); 
    }

    function setupSprite(type, index, isElite = false, isFirstSpawn = false) {
        const pic = document.getElementById('char-monster');
        const fallback = document.getElementById('fallback-monster');
        pic.classList.remove('anim-monster-hurt', 'anim-monster-die', 'anim-monster-enter');
        fallback.classList.remove('anim-monster-hurt', 'anim-monster-die', 'anim-monster-enter');
        pic.style.display = 'block'; fallback.style.display = 'none';

        let classBase = 'character monster ';
        if (!isFirstSpawn) classBase += 'anim-monster-enter ';
        if (state.level > 10 || state.level === 'endless') classBase += 'adv-monster ';
        
        if (type === 'boss') {
            pic.src = `images/${LORE_DB.boss[index].img}`; fallback.innerText = "☠️";
            pic.className = classBase + 'boss'; fallback.className = classBase + 'boss';
        } else if (type === 'boss-as-mob') {
            pic.src = `images/${LORE_DB.boss[index].img}`; fallback.innerText = "👾";
            pic.className = classBase + (isElite ? 'elite-monster' : ''); fallback.className = classBase + (isElite ? 'elite-monster' : '');
        } else if (type === 'practice') {
            pic.src = `images/mob-practice.png`; fallback.innerText = "🧸";
            pic.className = classBase; fallback.className = classBase;
        } else {
            pic.src = `images/${LORE_DB.mob[index].img}`; fallback.innerText = "👾";
            pic.className = classBase + (isElite ? 'elite-monster' : ''); fallback.className = classBase + (isElite ? 'elite-monster' : '');
        }
    }

    function showSpeech(text, isGood = true, isBossSkill = false) {
        const bubble = document.getElementById('ui-speech');
        bubble.innerHTML = text; 
        if (isBossSkill) { bubble.classList.add('boss-skill'); } 
        else { bubble.classList.remove('boss-skill'); bubble.style.color = isGood ? '#1e3799' : '#e84118'; }
        bubble.classList.add('show');
        safeSetTimeout(() => { bubble.classList.remove('show'); }, 2000);
    }

    function updateUI() {
        let hpHTML = "";
        for(let i = 0; i < state.maxHp; i++) {
            if(i < state.hp) hpHTML += `<img src="images/icon-heart-full.png" class="hp-icon" onerror="this.outerHTML='❤️'">`;
            else hpHTML += `<img src="images/icon-heart-empty.png" class="hp-icon" onerror="this.outerHTML='🖤'">`;
        }
        document.getElementById('ui-hp').innerHTML = hpHTML;
        
        const progressUI = document.getElementById('ui-progress');
        if (state.isEndless) progressUI.innerHTML = `🏆 總擊退: <span style="color:#fff;">${state.endlessScore}</span>`;
        else if (state.isPractice) progressUI.innerHTML = `🎓 練習中: <span style="color:#fff;">${state.endlessScore}/50</span>`;
        else progressUI.innerHTML = `🚩 進度: <span style="color:#fff;">${state.monstersDefeated}/${state.maxMonsters}</span>`;

        const monsterUi = document.getElementById('monster-ui');
        const hpFill = document.getElementById('monster-hp-fill');
        const hpText = document.getElementById('monster-hp-text');
        
        if (monsterUi.style.display !== 'none') {
            if (state.isBoss) {
                monsterUi.className = 'monster-ui boss-ui';
                let pct = (state.bossHp / state.baseBossHp) * 100;
                hpFill.style.width = Math.max(pct, 0) + '%';
                hpText.innerText = `Boss HP: ${Math.max(state.bossHp, 0)} / ${state.baseBossHp}`;
            } else {
                let isElite = state.isEndless ? (state.endlessScore % 5 === 4) : (!state.isPractice && state.monstersDefeated === state.maxMonsters - 1);
                monsterUi.className = isElite ? 'monster-ui elite-ui' : 'monster-ui';
                let pct = (state.monsterHp / state.monsterMaxHp) * 100;
                hpFill.style.width = Math.max(pct, 0) + '%';
                hpText.innerText = `HP: ${Math.max(state.monsterHp, 0)} / ${state.monsterMaxHp}`;
            }
        }
    }

    function generateQuestion() {
        if (gameState !== 'PLAYING') return;
        resetTimer();
        for(let i=0; i<3; i++) {
            let btn = document.getElementById(`btn-ans-${i}`);
            btn.style.color = "#fff"; btn.classList.remove('flash-correct', 'flash-wrong'); btn.disabled = false;
        }
        document.getElementById('ui-question').classList.remove('interference');

        let num1;
        if (state.isPractice) num1 = Math.floor(Math.random() * state.practiceRange) + 1;
        else if (state.level === 'endless' || state.level === 10 || state.level === 20) num1 = Math.floor(Math.random() * 9) + 1; 
        else if (state.level > 10) num1 = state.level - 10; 
        else num1 = state.level; 
        
        let num2 = Math.floor(Math.random() * 9) + 1;
        state.correctAnswer = num1 * num2;
        document.getElementById('ui-question').innerText = `${num1} x ${num2} = ?`;

        let wrong1 = state.correctAnswer + (Math.floor(Math.random() * 5) + 1);
        let wrong2 = state.correctAnswer - (Math.floor(Math.random() * 5) + 1);
        if(wrong2 <= 0) wrong2 = state.correctAnswer + 6; if(wrong1 === wrong2) wrong1 += 2;

        let options = [state.correctAnswer, wrong1, wrong2].sort(() => Math.random() - 0.5);
        for(let i=0; i<3; i++) document.getElementById(`btn-ans-${i}`).innerText = options[i];

        if (state.isBoss && state.isHardMode) {
            if (Math.random() > 0.75) { 
                let skillType = Math.floor(Math.random() * 3);
                if (skillType === 0) { document.getElementById('ui-question').classList.add('interference'); showSpeech("深海迷霧！", false, true); }
                else if (skillType === 1) { state.timer -= 25; showSpeech("時間吞噬！", false, true); }
                else if (skillType === 2) {
                    for(let i=0; i<3; i++) {
                        document.getElementById(`btn-ans-${i}`).style.color = "transparent";
                        safeSetTimeout(() => { const btn = document.getElementById(`btn-ans-${i}`); if(btn) btn.style.color = "#fff"; }, 800);
                    }
                    showSpeech("暗影遮蔽！", false, true);
                }
            }
        }
    }

    function resetTimer() {
        clearInterval(state.timerInterval);
        if (state.isPractice) {
            document.getElementById('ui-timer').style.width = '100%';
            document.getElementById('ui-timer').style.background = '#3498db'; return; 
        }
        state.timer = 100;
        const timerBar = document.getElementById('ui-timer');
        timerBar.style.width = '100%'; timerBar.style.background = 'linear-gradient(90deg, #00ffcc, #00bfff)';
        
        let speed = state.isHardMode ? 60 : 100;
        if(state.timeBuff) speed = Math.floor(speed * 1.25); 

        state.timerInterval = setInterval(() => {
            if (gameState !== 'PLAYING' || document.hidden) return; 
            state.timer -= 1; timerBar.style.width = state.timer + '%';
            if(state.timer < 30) timerBar.style.background = 'linear-gradient(90deg, #ff4757, #ff6b81)';
            if(state.timer <= 0) { clearInterval(state.timerInterval); handleTimeout(); }
        }, speed);
    }
    
    function handleTimeout() {
        if (gameState !== 'PLAYING') return;
        gameState = 'RESOLVING'; handleWrong("時間到！");
    }

    function bindAnswerButtons() {
        document.getElementById('btn-ans-0').addEventListener('click', () => checkAnswer(0));
        document.getElementById('btn-ans-1').addEventListener('click', () => checkAnswer(1));
        document.getElementById('btn-ans-2').addEventListener('click', () => checkAnswer(2));
        window.addEventListener('keydown', (e) => {
            if (gameState === 'PLAYING') {
                if (e.key === '1' || e.key === 'NumPad1') document.getElementById('btn-ans-0').click();
                if (e.key === '2' || e.key === 'NumPad2') document.getElementById('btn-ans-1').click();
                if (e.key === '3' || e.key === 'NumPad3') document.getElementById('btn-ans-2').click();
            }
        });
    }

    function checkAnswer(btnIndex) {
        if (gameState !== 'PLAYING') return; 
        gameState = 'RESOLVING'; 
        clearInterval(state.timerInterval); document.getElementById('ui-question').classList.remove('interference'); 
        for(let i=0; i<3; i++) document.getElementById(`btn-ans-${i}`).disabled = true; 
        
        const btn = document.getElementById(`btn-ans-${btnIndex}`);
        const selected = parseInt(btn.innerText);
        let mermaid = document.getElementById('char-mermaid');
        let partnerContainer = document.getElementById('char-partner-container');
        if(mermaid.style.display === 'none') mermaid = document.getElementById('fallback-mermaid');
        
        mermaid.classList.remove('anim-attack', 'anim-hurt', 'anim-mermaid-enter', 'anim-mermaid-run'); 
        partnerContainer.classList.remove('anim-partner-atk', 'anim-mermaid-enter', 'anim-mermaid-run');
        void mermaid.offsetWidth; void partnerContainer.offsetWidth;

        if(selected === state.correctAnswer) {
            btn.classList.add('flash-correct'); handleCorrect(mermaid, partnerContainer);
        } else {
            btn.classList.add('flash-wrong'); handleWrong("哎呀，答錯了！", mermaid);
        }
    }

    function handleCorrect(mermaid, partnerContainer) {
        playSFX('correct'); 
        let currentOutfitImg = 'char-mermaid-default-atk.png'; 
        if (saveFile.equipped && saveFile.equipped.outfit) {
            const outfitData = ITEM_DB.outfit.find(i => i.id === saveFile.equipped.outfit);
            if(outfitData) currentOutfitImg = outfitData.img.replace('.png', '-atk.png');
        }

        if (mermaid.id === 'char-mermaid') { 
            mermaid.src = `images/${currentOutfitImg}`;
            mermaid.onerror = function() { 
                const normalData = ITEM_DB.outfit.find(i => i.id === saveFile.equipped.outfit);
                this.src = normalData ? `images/${normalData.img}` : 'images/char-mermaid-default.png'; 
            };
            safeSetTimeout(() => { 
                const normalData = ITEM_DB.outfit.find(i => i.id === saveFile.equipped.outfit);
                mermaid.src = normalData ? `images/${normalData.img}` : 'images/char-mermaid-default.png'; 
            }, 400); 
        }
        
        mermaid.classList.add('anim-attack');
        if(saveFile.equippedPartner !== null) partnerContainer.classList.add('anim-partner-atk');

        let monster = document.getElementById('char-monster');
        if(monster.style.display === 'none') monster = document.getElementById('fallback-monster');
        monster.classList.remove('anim-monster-hurt', 'anim-monster-enter');
        void monster.offsetWidth; monster.classList.add('anim-monster-hurt');

        if (state.isPractice) {
            state.endlessScore++; updateUI();
            if (state.endlessScore >= 50) {
                showSpeech("練習達成！", true); handleMonsterDeath(monster, () => { endGame(true); }, false);
            } else {
                showSpeech("答對了！", true); handleMonsterDeath(monster, () => { spawnNextMonster(false, () => { gameState = 'PLAYING'; generateQuestion(); }); });
            }
            return;
        }

        if (state.isEndless) {
            if (state.isBoss) {
                state.bossHp--; updateUI();
                if(state.bossHp <= 0) {
                    handleMonsterDeath(monster, () => {
                        if (state.hp < state.maxHp) state.hp++; 
                        showSpeech("擊退Boss！<br>愛心回復！"); state.isBoss = false; state.monsterHp = state.monsterMaxHp;
                        spawnNextMonster(false, () => { gameState = 'PLAYING'; generateQuestion(); }); 
                    }); return;
                }
            } else {
                state.monsterHp--; updateUI();
                if(state.monsterHp <= 0) {
                    state.endlessScore++;
                    handleMonsterDeath(monster, () => {
                        if (state.endlessScore > 0 && state.endlessScore % 5 === 0) triggerBoss();
                        else {
                            showSpeech(["小怪消滅！", "下一隻！"][Math.floor(Math.random()*2)], true); state.monsterHp = state.monsterMaxHp; 
                            spawnNextMonster(false, () => { gameState = 'PLAYING'; generateQuestion(); }); 
                        }
                    }); return;
                } else showSpeech("造成傷害！", true);
            }
            safeSetTimeout(() => { gameState = 'PLAYING'; generateQuestion(); }, 600); return;
        }

        if(state.isBoss) {
            state.bossHp--; updateUI();
            if(state.bossHp <= 0) {
                showSpeech("擊敗Boss！", true); handleMonsterDeath(monster, () => { endGame(true); }, true); return;
            }
            showSpeech("造成傷害！", true);
        } else {
            state.monsterHp--; updateUI();
            if (state.monsterHp <= 0) {
                state.monstersDefeated++;
                handleMonsterDeath(monster, () => {
                    if (state.monstersDefeated >= state.maxMonsters) triggerBoss();
                    else {
                        showSpeech(["小怪消滅！", "下一隻！"][Math.floor(Math.random()*2)], true); state.monsterHp = state.monsterMaxHp; 
                        spawnNextMonster(false, () => { gameState = 'PLAYING'; generateQuestion(); }); 
                    }
                }); return;
            } else showSpeech("造成傷害！", true);
        }
        safeSetTimeout(() => { gameState = 'PLAYING'; generateQuestion(); }, 600);
    }

    function handleMonsterDeath(monsterElement, callback, isBossKill = false) {
        document.getElementById('monster-ui').style.display = 'none'; 
        monsterElement.classList.add('anim-monster-die');
        if (isBossKill) {
            const flash = document.getElementById('victory-flash'); flash.classList.add('show');
            safeSetTimeout(() => { flash.classList.remove('show'); callback(); }, 1500); 
        } else { safeSetTimeout(callback, 600); }
    }

    function handleWrong(msg, mermaid) {
        playSFX('wrong'); 
        const gameContainer = document.getElementById('game-container');
        gameContainer.classList.add('shake-screen');
        safeSetTimeout(() => gameContainer.classList.remove('shake-screen'), 400);

        if(!mermaid) mermaid = document.getElementById('char-mermaid');
        mermaid.classList.add('anim-hurt');
        
        if (!state.isPractice) state.hp--; 
        
        const questionUI = document.getElementById('ui-question');
        const originalQuestion = questionUI.innerText; 
        const expression = originalQuestion.split('=')[0].trim(); 
        questionUI.innerText = `${expression} = ${state.correctAnswer}`;
        questionUI.style.color = "#ff4757"; questionUI.style.textShadow = "0 0 15px #ff0000";

        showSpeech(msg + (state.isPractice ? "<br>再看清楚一點！" : "<br>記住答案喔！"), false); 
        updateUI();
        
        if(state.hp <= 0 && !state.isPractice) {
            safeSetTimeout(() => endGame(false), 2000); 
        } else {
            safeSetTimeout(() => { 
                questionUI.style.color = "#fff"; questionUI.style.textShadow = "0 0 20px #00ffff, 0 4px 8px rgba(0,0,0,0.8)";
                gameState = 'PLAYING'; generateQuestion(); 
            }, 2500); 
        }
    }

    function triggerBoss() {
        state.isBoss = true; state.bossHp = state.baseBossHp; 
        clearInterval(state.timerInterval); gameState = 'WARNING'; 
        
        document.getElementById('monster-ui').style.display = 'none'; document.getElementById('char-monster').style.display = 'none';
        
        let bossIndex = 0; 
        if (state.level === 10 || state.level === 20) bossIndex = 9; 
        else if (state.level > 10 && state.level !== 'endless') bossIndex = state.level - 11; 
        else if (state.level <= 9) bossIndex = state.level - 1; 
        else if (state.level === 'endless') bossIndex = Math.floor(Math.random() * 10);

        const warningScreen = document.getElementById('boss-warning');
        const bossSilhouette = document.getElementById('warning-boss-silhouette');
        const bossImageUrl = `images/${LORE_DB.boss[bossIndex].img}`;
        bossSilhouette.style.backgroundImage = `url('${bossImageUrl}')`;
        document.getElementById('boss-name-display').innerText = getBossName(bossIndex, state.level === 'endless');
        
        warningScreen.classList.add('show'); playSFX('warning');

        safeSetTimeout(() => {
            warningScreen.classList.remove('show'); setupSprite('boss', bossIndex, false, false); 
            document.getElementById('monster-hp-fill').style.width = '100%'; document.getElementById('monster-ui').style.display = 'block';
            let bossQuote = bossData[bossIndex] ? bossData[bossIndex].quote : "見識真正的力量吧！";
            showSpeech(bossQuote, false, true); 
            updateUI(); gameState = 'PLAYING'; generateQuestion(); 
        }, 2500);
    }

    function endGame(isWin) {
        if(gameState === 'RESULT') return; 
        gameState = 'RESULT'; clearAllTimers(); document.getElementById('monster-ui').style.display = 'none';
        if(isWin) playSFX('win'); else playSFX('lose');

        document.getElementById('fade-overlay').style.display = 'none';
        const pearlUI = document.getElementById('global-pearl-ui'); if (pearlUI) pearlUI.style.display = 'none'; 

        const title = document.getElementById('result-title');
        const desc = document.getElementById('result-desc');
        
        if (state.isPractice) {
            if (isWin) {
                state.sessionPearls = 10; addPearls(state.sessionPearls);
                title.innerText = "🎓 練習達成 🎓"; title.style.color = "#3498db"; title.style.textShadow = "0 0 15px #3498db";
                desc.innerHTML = `完成了 50 題數學練習！非常棒！<br><div style="margin: 15px 0; font-size: 18px; color: #f1c40f; text-shadow: 0 2px 4px #000; font-weight: bold;">懸賞金：🐚 +10</div>`;
            } else {
                title.innerText = "🎓 練習結束 🎓"; title.style.color = "#3498db"; title.style.textShadow = "0 0 15px #3498db";
                desc.innerHTML = `你完成了 ${state.endlessScore} 題練習。<br>繼續加油喔！`;
            }
        } else {
            if (isWin && !state.isEndless) {
                if (state.isFirstClear) {
                    if (state.level === 10 || state.level === 20) state.sessionPearls = 100; 
                    else state.sessionPearls = 30;  
                    addPearls(state.sessionPearls);
                } else { state.sessionPearls = 0; }
            } else if (isWin && state.isEndless) {
                state.sessionPearls = state.endlessScore * 5; addPearls(state.sessionPearls);
            }

            let pearlRewardHTML = "";
            if (isWin) {
                if (state.sessionPearls > 0) pearlRewardHTML = `<div style="margin: 15px 0; font-size: 18px; color: #f1c40f; text-shadow: 0 2px 4px #000; font-weight: bold;">過關懸賞金：🐚 +${state.sessionPearls}</div>`;
                else pearlRewardHTML = `<div style="margin: 15px 0; font-size: 14px; color: #aaa; font-weight: bold;">已通關過此海域，無額外珍珠獎勵</div>`;
            }

            if (state.isEndless) {
                title.innerText = "⭐ 挑戰結束 ⭐"; title.style.color = "#ffeb3b"; title.style.textShadow = "0 0 15px #ffeb3b";
                desc.innerHTML = `你總共淨化了 <b style="color:#00ffcc; font-size:32px; text-shadow: 0 0 10px #00ffcc;">${state.endlessScore}</b> 隻海怪！<br>${pearlRewardHTML}`;
            } else if(isWin) {
                title.innerText = "⭐ 關卡完成！ ⭐"; title.style.color = "#ffeb3b"; title.style.textShadow = "0 0 15px #ffeb3b";
                
                let extraMsg = "";
                if (state.level === 1 && state.isFirstClear && !saveFile.unlockedCards.includes(0)) {
                    let partner = LORE_DB.partner[0];
                    extraMsg = `
                    星光魔法成功淨化了海怪！<br>
                    <span style="color:#00ffcc; font-weight:bold; font-size: 14px;">獲得了第一位專屬神聖夥伴！</span>
                    <div class="result-card-container">
                        <div class="poker-card equipped" style="width: 100px; height: 140px; cursor: default;">
                            <div style="position:absolute; width:100%; height:100%; background:linear-gradient(135deg, #1a2a6c, #0d1b2a); border-radius:8px;"></div>
                            <img src="images/ui-card-front.png" class="card-bg" onerror="this.style.display='none';">
                            <img src="images/${partner.img}" class="card-partner-img" onerror="this.style.display='none';">
                            <div class="card-name-tag" style="font-size:8px;">${partner.name}</div>
                            <div class="equip-tag" style="font-size:8px;">NEW!</div>
                        </div>
                    </div>`;
                    saveFile.unlockedCards.push(0);
                } 
                else if (state.level === 10 && state.isFirstClear) extraMsg = `太強了！你擊敗了最終大魔王！<br><span style="color:#ff4757; font-weight:bold; font-size:15px;">🔥 已為您解鎖【進階模式】 🔥</span>`;
                else if (state.level === 19 && state.isFirstClear) extraMsg = `進階考驗通過！<br><span style="color:#ff4757; font-weight:bold; font-size:15px;">👑 已解鎖【進階第10關】真・大魔王 🔥</span>`;
                else if (state.level === 20 && state.isFirstClear) extraMsg = `不可思議！你擊敗了真・大魔王！<br><span style="color:#00ffcc; font-weight:bold; font-size:15px;">✨ 已為您解鎖【無限挑戰模式】 ✨</span>`;
                else extraMsg = `星光魔法成功淨化了海怪！`;
                
                desc.innerHTML = pearlRewardHTML + extraMsg;
                if (state.level === saveFile.unlockedLevel) saveFile.unlockedLevel++;
                saveData();
            } else {
                title.innerText = "💧 挑戰失敗 💧"; title.style.color = "#ff4757"; title.style.textShadow = "0 0 15px #ff4757";
                desc.innerHTML = `魔法愛心消耗殆盡，稍微休息一下再出發吧！`;
            }
        }
        safeSetTimeout(() => showScreen('result-screen', 'RESULT'), 800); 
    }

    function updateRoomDisplay() {
        const bgLayer = document.getElementById('room-bg-layer');
        const bedLayer = document.getElementById('room-bed-layer');
        const habitatLayer = document.getElementById('room-habitat-layer');
        const outfitLayer = document.getElementById('room-outfit-layer');
        const emptySrc = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

        let bgData = ITEM_DB.bg.find(i => i.id === saveFile.equipped.bg);
        if(bgData) { bgLayer.src = `images/${bgData.img}`; bgLayer.style.display = 'block'; } else { bgLayer.src = emptySrc; }

        let bedData = ITEM_DB.bed.find(i => i.id === saveFile.equipped.bed);
        if(bedData) { bedLayer.src = `images/${bedData.img}`; bedLayer.style.display = 'block'; } else { bedLayer.src = emptySrc; bedLayer.style.display = 'none'; }

        let habitatData = ITEM_DB.habitat.find(i => i.id === saveFile.equipped.habitat);
        if(habitatData) { habitatLayer.src = `images/${habitatData.img}`; habitatLayer.style.display = 'block'; } else { habitatLayer.src = emptySrc; habitatLayer.style.display = 'none'; }

        let outfitData = ITEM_DB.outfit.find(i => i.id === saveFile.equipped.outfit);
        if(outfitData) { outfitLayer.src = `images/${outfitData.img}`; outfitLayer.style.display = 'block'; } else { outfitLayer.src = 'images/char-mermaid-default.png'; }
    }

    function openRoomModal(category) {
        let title = "";
        if(category === 'bg') title = "選擇房間背景";
        else if(category === 'outfit') title = "選擇華麗套裝";
        else if(category === 'habitat') title = "選擇夥伴的窩";
        else if(category === 'bed') title = "選擇公主床舖";
        else if(category === 'title') title = "選擇星語稱號";
        
        document.getElementById('room-modal-title').innerText = title;
        document.getElementById('room-item-modal').style.display = 'flex';
        const grid = document.getElementById('room-item-grid');
        grid.innerHTML = '';

        if (category === 'title') {
            if (saveFile.unlockedTitles.length === 0) {
                grid.innerHTML = '<div style="color:#aaa; text-align:center; grid-column: 1 / -1; margin-top:20px;">尚未獲得任何稱號，快去魔法珍珠商店喚醒吧！</div>'; return;
            }
            saveFile.unlockedTitles.forEach(tName => {
                const isEquipped = (saveFile.equippedTitle === tName);
                let card = document.createElement('div');
                card.className = `room-item-card ${isEquipped ? 'equipped' : ''}`; card.style.background = 'rgba(0,0,0,0.7)';
                card.onclick = () => { saveFile.equippedTitle = tName; saveData(); openRoomModal('title'); };
                card.innerHTML = `<div style="font-size:16px; font-weight:bold; text-align:center; color:#00ffff; width:100%; padding:10px;">${tName}</div>${isEquipped ? '<div class="equip-tag" style="position:absolute; top:4px; right:4px; font-size:8px; background:#00ffcc; color:#000; padding:2px 5px; border-radius:6px; font-weight:bold;">裝備中</div>' : ''}`;
                grid.appendChild(card);
            });
            return;
        }

        const items = ITEM_DB[category];
        if(!items || items.length === 0) { grid.innerHTML = '<div style="color:#aaa; text-align:center; grid-column: 1 / -1; margin-top:20px;">尚無道具資料</div>'; return; }

        items.forEach(item => {
            const isOwned = saveFile.inventory.includes(item.id);
            const isEquipped = saveFile.equipped[category] === item.id;
            let card = document.createElement('div');
            card.className = `room-item-card ${isEquipped ? 'equipped' : ''} ${!isOwned ? 'locked' : ''}`;
            if (isOwned) card.onclick = () => equipRoomItem(category, item.id);
            else card.onclick = () => alert("尚未擁有此道具！\n\n請透過主選單的【🐚 魔法珍珠商店】喚醒獲得喔！");

            card.innerHTML = `<img src="images/${item.img}" onerror="this.style.display='none';"><div class="room-item-name">${item.name}</div>${isEquipped ? '<div class="equip-tag" style="position:absolute; top:4px; right:4px; font-size:8px; background:#00ffcc; color:#000; padding:2px 5px; border-radius:6px; font-weight:bold;">裝備中</div>' : ''}${!isOwned ? '<div style="position:absolute; font-size:24px; text-shadow: 0 2px 4px #000;">🔒</div>' : ''}`;
            grid.appendChild(card);
        });
    }

    function equipRoomItem(category, itemId) {
        saveFile.equipped[category] = itemId; saveData(); updateRoomDisplay(); openRoomModal(category); 
    }
    function closeRoomModal() { document.getElementById('room-item-modal').style.display = 'none'; }
</script>
</body>
</html>
